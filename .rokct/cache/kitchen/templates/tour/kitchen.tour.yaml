# Guided-tour fragment for kitchen_sdk (manager role).
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the one screen
# kitchen_sdk installs for app_type=manager composes: the Kitchen tab
# (KitchenHomePage, tab-hosted at index 2 of merchants_sdk's home shell
# since merchants_sdk 1.14.0 — between the order queue at 1 and foods at 3
# — per its install contract, so it declares no route). Include it only in
# manager-family app manifests.
#
# Demo grounding (a demo session): the REAL KitchenOrdersRepository runs
# and base_sdk's DemoGatewayInterceptor answers its cmds from the fixtures
# in assets/demo/kitchen, a seeded service of five tickets across
# accepted/cooking/ready. So the step
# below captures a live queue with ticking flip clocks, dish pills and
# populated filter counts, with zero backend contact.
#
# The cross-SDK import below is the established shell contract: the
# Kitchen tab is selected through merchants_sdk's mainProvider, the same
# state the shell's bottom-navigation buttons drive (orders fragment
# precedent).
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: kitchen
imports:
  - "import 'package:flutter_riverpod/flutter_riverpod.dart';"
  - "import 'package:merchants_sdk/src/manager/application/main/main_provider.dart';"
  - "import 'package:kitchen_sdk/src/manager/application/kitchen/kitchen_provider.dart';"
  - "import 'package:kitchen_sdk/src/manager/presentation/kitchen/kitchen_order_card.dart';"
steps:
  - key: kitchen_queue
    title: "The kitchen sees every order"
    caption: "Accepted, cooking, ready - the *kitchen queue* tracks every dish with a live clock, so nothing burns and nothing waits."
    action: dart
    settle: 8
    dart: |
      // Land the manager home shell and select the Kitchen tab (index 2
      // since merchants_sdk 1.14.0 - the POS till is 0, the order queue 1)
      // explicitly - an earlier fragment may have left another tab
      // selected, and mainProvider's selection persists across routes.
      router.replaceNamed('/main');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      container.read(mainProvider.notifier).selectIndex(2);
  - key: kitchen_detail
    title: "Every dish on one ticket"
    caption: "Tap an order for its *full ticket* - each dish, its status and the clock - and move it along the line."
    action: dart
    settle: 6
    dart: |
      // The queue from the step above is still on screen. A card tap opens
      // the ticket the way a cook does: a pushed page on a phone, the detail
      // plane where the queue has more than one. The cards only exist once
      // the queue's fetch has answered, and a tap with no card is a silent
      // no-op that leaves this still byte-identical to kitchen_queue - so
      // wait for a card, re-fetching once if the first answer was empty,
      // and say in the log which case happened.
      final Finder card = find.byType(KitchenOrderCard);
      final Element element = tester.element(find.byType(Navigator).first);
      final ProviderContainer container =
          ProviderScope.containerOf(element, listen: false);
      for (int i = 0; i < 12 && card.evaluate().isEmpty; i++) {
        if (i == 4) {
          await container
              .read(kitchenProvider.notifier)
              .fetchOrders(isRefresh: true);
        }
        await Future<void>.delayed(const Duration(milliseconds: 500));
        await tester.pump();
      }
      if (card.evaluate().isEmpty) {
        // ignore: avoid_print
        print('[tour] kitchen_detail: no KitchenOrderCard after 6s - the queue is empty (demo fixture missing?)');
      } else {
        try {
          await tester.ensureVisible(card.first);
        } catch (_) {}
        await tester.pump(const Duration(milliseconds: 300));
        await tester.tap(card.first, warnIfMissed: false);
      }
  - key: kitchen_detail_close
    title: "Back to the queue"
    action: dart
    screenshot: false
    settle: 3
    dart: |
      // Tolerant: the phone's ticket is a pushed page above /main; on the
      // planes spread nothing was pushed and the detail is a plane.
      final NavigatorState navigator =
          tester.state(find.byType(Navigator).first);
      if (find.byType(KitchenOrderCard).evaluate().isEmpty &&
          navigator.canPop()) {
        navigator.pop();
      }
