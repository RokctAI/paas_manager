# Guided-tour fragment for productivity_sdk.
#
# Brand-neutral by rule: app names, taglines and any per-app wording live in
# the app shell's tour/app.tour.yaml ({app_name}/{app_tagline} placeholders
# are substituted at merge time). This fragment owns the screens
# productivity_sdk installs: the tasks planner at /tasks (manifest.json
# routes, TasksRoute — the SDK's own home_page) and a task's guided run at
# /tasks/run (TaskRunRoute).
#
# No demo repository: tasks live in the app's local drift database
# (manifest.json "database" tables), so the screen renders its own
# add-a-task surface on a fresh install and every entry made during the
# tour persists locally without any backend. The two service-run steps
# below therefore seed what they show themselves — one described plant and
# one softener service run, written through the same repository the page
# writes — so the stills carry a real run rather than an empty list.
#
# Format: RokctAI/shared-workflows scripts/tour/README.md
sdk: productivity
imports:
  - "import 'package:base_sdk/src/database/app_database.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/maintenance_plant.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/maintenance_templates.dart';"
  - "import 'package:productivity_sdk/src/common/application/run/task_run.dart';"
  - "import 'package:productivity_sdk/src/common/infrastructure/repositories/todo_repository_impl.dart';"
  - "import 'package:productivity_sdk/src/common/presentation/run/task_run_view.dart';"
steps:
  - key: productivity_tasks
    title: "Plan your day in seconds"
    caption: "Capture to-dos with subtasks and categories - *your day, planned* before it starts."
    action: route
    route: /tasks
    settle: 7
  # Design strip section 47 (47a / 47d): the compose lane's "From
  # template" row. The plant is described first (47d's gate), so the
  # service templates are live; the softener one is picked so the still
  # shows the form filled with its eleven steps.
  - key: productivity_task_compose
    title: "A service run from a template"
    caption: "Softener, megaChar, filters and membranes - *one tap fills the task* with every step and its timing."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      await MaintenancePlantStore.local.save(
        PlantRecord(
          megaCharVessels: 1,
          softenerVessels: 1,
          vesselsInstalledOn: DateTime(2026, 3, 14),
          preFilterInstalledOn: DateTime(2026, 8, 20),
          roFilterInstalledOn: DateTime(2026, 6, 1),
          postFilterInstalledOn: DateTime(2026, 6, 1),
          membranes: 2,
          membranesInstalledOn: DateTime(2026, 1, 10),
          recordedAt: DateTime.now(),
        ),
      );
      router.replaceNamed('/tasks');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Finder compose = find.byKey(const ValueKey<String>('tasks-compose'));
      if (compose.evaluate().isNotEmpty) {
        await tester.tap(compose.first, warnIfMissed: false);
        await Future<void>.delayed(const Duration(seconds: 2));
      }
      final Finder softener = find.byKey(
        const ValueKey<String>('template-softener_maintenance'),
      );
      if (softener.evaluate().isNotEmpty) {
        await tester.tap(softener.first, warnIfMissed: false);
      }
  # 47a / 47b / 47h: a softener service already through its nine stages,
  # opened at its readings step with the permeate TDS out of spec, so the
  # still carries the amber block and its wording.
  - key: productivity_maintenance_readings
    title: "Readings before it goes back to service"
    caption: "TDS and pressure, checked against the plant's limits - *out of spec is named* and holds the finish until it is re-tested or explained."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      final DateTime now = DateTime.now();
      final Map<String, dynamic> task = MaintenanceTemplates.build(
        MaintenanceTemplate.softenerMaintenance,
        now: now,
      );
      task['id'] = 'tour-softener-sft-02';
      task['notifId'] = 47021;
      task['title'] = 'Softener SFT-02 · Polokwane plant';
      task['category'] = 'Plant';
      task['createdAt'] = now.toIso8601String();
      TaskRun run = TaskRun.fromTask(task);
      DateTime at = now.subtract(const Duration(hours: 1, minutes: 5));
      for (int i = 0; i < 9; i++) {
        run = run.start(i, at);
        at = at.add(Duration(seconds: run.steps[i].durationSeconds));
        run = run.complete(i, at);
      }
      await TodoRepositoryImpl(AppDatabase()).saveTodos(
        <Map<String, dynamic>>[run.applyTo(task)],
      );
      router.replaceNamed('/tasks/run?task=tour-softener-sft-02');
      await Future<void>.delayed(const Duration(seconds: 3));
      final Finder resume = find.byKey(TaskRunView.resumeKey);
      if (resume.evaluate().isNotEmpty) {
        await tester.tap(resume.first, warnIfMissed: false);
        await Future<void>.delayed(const Duration(seconds: 1));
      }
      const List<String> readings = <String>['175', '212', '8.4', '1.9'];
      for (int i = 0; i < readings.length; i++) {
        final Finder field = find.byKey(TaskRunView.readingKey(i));
        if (field.evaluate().isNotEmpty) {
          await tester.enterText(field.first, readings[i]);
          await tester.pump();
        }
      }
  # 47i: the permeate reading corrected, the readings step finished, and
  # the optional photo step with its live Skip beside Finish.
  - key: productivity_maintenance_photo
    title: "A photo and a note, if you want them"
    caption: "The last step is optional - *Skip is live* beside Finish, and nothing here can trap you mid-run."
    action: dart
    screenshot: true
    settle: 6
    dart: |
      final Finder permeate = find.byKey(TaskRunView.readingKey(1));
      if (permeate.evaluate().isNotEmpty) {
        await tester.enterText(permeate.first, '40');
        await tester.pump();
      }
      final Finder forward = find.byKey(TaskRunView.continueKey);
      if (forward.evaluate().isNotEmpty) {
        await tester.tap(forward.first, warnIfMissed: false);
      }
