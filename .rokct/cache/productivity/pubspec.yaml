name: productivity_sdk
description: "Team task tracking, checklists, workflow management, and operational action items."
version: 1.1.0
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.3
  share_plus: ^10.1.1
  path_provider: ^2.1.5
  # This SDK's own lib/ imports both (the section-44 task components:
  # task_card.dart, task_list_controls.dart), as does the installed tasks
  # page template. They must be declared here rather than leaned on
  # transitively through base_sdk, or the day base_sdk drops either one
  # this package stops resolving. Same constraints as base_sdk.
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  # The installed tasks page template (templates/pages/tasks) imports this;
  # it must be declared here or the composed app fails to build.
  table_calendar: ^3.1.0
  drift: ^2.19.0
  base_sdk:
    path: ../base
dev_dependencies:
  flutter_test:
    sdk: flutter
  # Test-only. lib/ deliberately does NOT import dio: the sync handlers go
  # through base_sdk's PlatformGateway and never touch a client directly.
  # The sync tests stand a fake HttpService in front of that gateway so the
  # push and pull paths can be driven end to end without a server, and the
  # Dio/HttpClientAdapter types for that fake come from here.
  dio: ^5.7.0

# Workspace-relative overrides so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  share_plus: ^10.1.1
  get_it: ^8.0.0
  base_sdk:
    path: ../../../core/base/dart
