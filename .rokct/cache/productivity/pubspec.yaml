name: productivity_sdk
description: "Team task tracking, checklists, workflow management, and operational action items."
version: 1.0.2
publish_to: 'none'
environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.5'
dependencies:
  flutter:
    sdk: flutter
  uuid: ^4.5.3
  share_plus: ^10.1.1
  path_provider: ^2.1.5
  # The installed tasks page template (templates/pages/tasks) imports this;
  # it must be declared here or the composed app fails to build.
  table_calendar: ^3.1.0
  drift: ^2.19.0
  base_sdk:
    path: ../base
dev_dependencies:
  flutter_test:
    sdk: flutter

# Workspace-relative overrides so this package resolves standalone for
# codegen/analysis. Ignored when a host app is the resolution root.
dependency_overrides:
  share_plus: ^10.1.1
  get_it: ^8.0.0
  base_sdk:
    path: ../../../core/base/dart
