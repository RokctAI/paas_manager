name: manager
description: Composed RokctAI app shell (installed by base_sdk).

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.7.5+16

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  # Composed SDKs (20) - vendored by the composer into .rokct/cache/* from
  # composer.json (The-Rokct-Protocol manager.json incl. protocol#149's
  # calc_sdk + weather_sdk). agent_sdk is disabled there and auth_sdk is
  # composed with skip_install (host-owned auth pages).
  base_sdk:
    path: .rokct/cache/base
  auth_sdk:
    path: .rokct/cache/auth
  users_sdk:
    path: .rokct/cache/users
  merchants_sdk:
    path: .rokct/cache/merchants
  products_sdk:
    path: .rokct/cache/products
  orders_sdk:
    path: .rokct/cache/orders
  kitchen_sdk:
    path: .rokct/cache/kitchen
  hardware_sdk:
    path: .rokct/cache/hardware
  payments_sdk:
    path: .rokct/cache/payments
  subscriptions_sdk:
    path: .rokct/cache/subscriptions
  comms_sdk:
    path: .rokct/cache/comms
  processing_sdk:
    path: .rokct/cache/processing
  productivity_sdk:
    path: .rokct/cache/productivity
  calc_sdk:
    path: .rokct/cache/calc
  corporate_sdk:
    path: .rokct/cache/corporate
  promotions_sdk:
    path: .rokct/cache/promotions
  map_sdk:
    path: .rokct/cache/map
  weather_sdk:
    path: .rokct/cache/weather
  revenue_sdk:
    path: .rokct/cache/revenue
  zones_sdk:
    path: .rokct/cache/zones
  flutter:
    sdk: flutter

  #base:
  dio: ^5.7.0
  jiffy: ^6.3.1
  intl: ^0.19.0
  lottie: ^3.0.0
  get_it: ^8.0.0
  shimmer: ^3.0.0
  http: ^1.2.2
  auto_route: ^9.2.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0
  google_fonts: 6.3.0
  sms_autofill: ^2.4.1
  image_picker: ^1.1.2
  flutter_remix: ^0.0.3
  remixicon: ^1.2.0
  path_provider: ^2.1.2
  pull_to_refresh: ^2.0.0
  flutter_slidable: ^3.0.1
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.5
  sliding_up_panel: ^2.0.0+1
  freezed_annotation: ^2.4.4
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.2 #below this version is vanerable
  proste_indexed_stack: ^0.2.4
  cached_network_image: ^3.3.1
  calendar_date_picker2: ^1.1.5
  top_snackbar_flutter: ^3.1.0
  flutter_native_splash: ^2.4.2
  flutter_advanced_switch: ^3.0.1
  dotted_border: ^2.1.0
  intl_phone_field: ^3.2.0
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0
  fl_chart: ^0.69.0
  auto_size_text: ^3.0.0
  file_picker: ^8.0.7
  image: ^4.1.7
  app_tracking_transparency: ^2.0.6
  permission_handler: ^11.3.1

  #maps:
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  osm_nominatim: ^3.0.1
  google_maps_flutter: ^2.9.0
  google_place:
    git:
     url: https://github.com/muhammadyunusxon/google_place.git

  #auth:
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_facebook_auth: ^7.0.0

  #firebase:
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  firebase_remote_config: ^5.1.3
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  build_runner: ^2.4.12
  flutter_lints: ^5.0.0
  auto_route_generator: ^9.0.0
  flutter_launcher_icons: ^0.14.1
  cupertino_icons: ^1.0.6

flutter_native_splash:
  background_image: 'assets/image/splash.png'

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/image/
    - assets/lottie/

flutter_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 23
  remove_alpha_ios: true
  image_path: 'assets/image/manager.png'

# Version arbitration across the composed SDK set (kernel pins an older
# ecosystem than the newest SDKs; root overrides win globally). Mirrors
# paas_driver's converted pubspec.
dependency_overrides:
  get_it: ^8.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  freezed_annotation: ^2.4.4
  google_fonts: ^6.3.0
  http: ^1.2.0
  sqlite3: 2.9.4
