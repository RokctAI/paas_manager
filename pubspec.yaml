name: manager
description: Composed RokctAI app shell (installed by base_sdk).

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.7.5+16

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  base_sdk:
    path: .rokct/cache/base
  auth_sdk:
    path: .rokct/cache/auth
  users_sdk:
    path: .rokct/cache/users
  merchants_sdk:
    path: .rokct/cache/merchants
  products_sdk:
    path: .rokct/cache/products
  orders_sdk:
    path: .rokct/cache/orders
  kitchen_sdk:
    path: .rokct/cache/kitchen
  hardware_sdk:
    path: .rokct/cache/hardware
  desktop_sdk:
    path: .rokct/cache/desktop
  payments_sdk:
    path: .rokct/cache/payments
  subscriptions_sdk:
    path: .rokct/cache/subscriptions
  comms_sdk:
    path: .rokct/cache/comms
  telemetry_sdk:
    path: .rokct/cache/telemetry
  processing_sdk:
    path: .rokct/cache/processing
  productivity_sdk:
    path: .rokct/cache/productivity
  calc_sdk:
    path: .rokct/cache/calc
  corporate_sdk:
    path: .rokct/cache/corporate
  promotions_sdk:
    path: .rokct/cache/promotions
  booking_sdk:
    path: .rokct/cache/booking
  map_sdk:
    path: .rokct/cache/map
  weather_sdk:
    path: .rokct/cache/weather
  revenue_sdk:
    path: .rokct/cache/revenue
  zones_sdk:
    path: .rokct/cache/zones
  hms_sdk:
    path: .rokct/cache/hms
  # Composed SDKs (21) - vendored by the composer into .rokct/cache/* from
  # composer.json (The-Rokct-Protocol manager.json incl. protocol#149's
  # calc_sdk + weather_sdk). agent_sdk is disabled there and auth_sdk is
  # composed with skip_install (host-owned auth pages).
  flutter:
    sdk: flutter

  #base:
  dio: ^5.7.0
  jiffy: ^6.3.1
  intl: ^0.19.0
  lottie: ^3.0.0
  get_it: ^8.0.0
  shimmer: ^2.0.0 # pinned down to base_sdk's range (mirrors paas_driver); host usage is plain Shimmer.fromColors, identical API
  http: ^1.2.2
  auto_route: ^9.2.0
  flutter_svg: ^2.0.9
  url_launcher: ^6.3.0
  google_fonts: 6.3.0
  sms_autofill: ^2.4.1
  image_picker: ^1.1.2
  flutter_remix: ^0.0.3
  remixicon: ^1.2.0
  path_provider: ^2.1.2
  pull_to_refresh: ^2.0.0
  # 3.x uses the removed Flutter 'hashValues' API (gone in Flutter 3.38);
  # 4.x (min Flutter 3.27) drops it with no changes to the Slidable/ActionPane
  # API surface used here.
  flutter_slidable: ^4.0.3
  flutter_riverpod: ^2.5.1
  connectivity_plus: ^6.0.5
  sliding_up_panel: ^2.0.0+1
  freezed_annotation: ^3.1.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.2 #below this version is vanerable
  proste_indexed_stack: ^0.2.4
  cached_network_image: ^3.3.1
  calendar_date_picker2: ^1.1.5
  top_snackbar_flutter: ^3.1.0
  flutter_native_splash: ^2.4.2
  flutter_advanced_switch: ^3.0.1
  dotted_border: ^2.1.0
  intl_phone_field: ^3.2.0
  package_info_plus: ^8.2.1
  device_info_plus: ^11.3.0
  fl_chart: ^0.69.0
  auto_size_text: ^3.0.0
  file_picker: ^8.0.7
  image: ^4.1.7
  app_tracking_transparency: ^2.0.6
  permission_handler: ^12.0.1

  #maps:
  geocoding: ^3.0.0
  geolocator: ^13.0.1
  osm_nominatim: ^3.0.1
  google_maps_flutter: ^2.9.0
  google_place:
    git:
     url: https://github.com/muhammadyunusxon/google_place.git

  #auth:
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2
  flutter_facebook_auth: ^7.0.0

  #firebase:
  firebase_core: ^3.10.0
  firebase_auth: ^5.4.0
  firebase_remote_config: ^5.1.3
  firebase_messaging: ^15.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Guided-tour runner (integration_test/guided_tour_test.dart) - drives the
  # demo build on the CI emulator for the marketing/tour screenshot pipeline.
  integration_test:
    sdk: flutter
  freezed: ^3.2.3
  build_runner: ^2.10.4
  flutter_lints: ^5.0.0
  # 9.x pins source_gen ^1.5/^2 which conflicts with freezed 3.x (source_gen
  # >=3); 10.3.x is the first line on analyzer 8 (10.4+ moves to auto_route
  # 11 / analyzer 10+, which drags freezed onto dev prereleases). Needs
  # auto_route 10.x at
  # runtime - arbitrated in dependency_overrides below.
  auto_route_generator: '>=10.3.1 <10.4.0'
  flutter_launcher_icons: ^0.14.1
  cupertino_icons: ^1.0.6

flutter_native_splash:
  background_image: 'assets/image/splash.png'

flutter:
  uses-material-design: true
  assets:
    # BEGIN sdk-app-assets (generated by SDK installer - do not edit by hand)
    - assets/audio/notification.wav
    - assets/audio/tap.wav
    - assets/audio/wrong.wav
    - assets/images/app_logo.png
    - assets/images/card.png
    - assets/images/cardBg.png
    - assets/images/delivery.png
    - assets/images/door.png
    - assets/images/fast.png
    - assets/images/logo.png
    - assets/images/notFound.png
    - assets/images/order.png
    - assets/images/save.png
    - assets/images/set.png
    - assets/images/splash.png
    - assets/images/splash1.png
    - assets/images/splash2.png
    - assets/images/ui0.png
    - assets/images/ui1.png
    - assets/images/ui2.png
    - assets/images/ui3.png
    - assets/images/visa.png
    - assets/lottie/girl_empty.json
    - assets/lottie/not-found.json
    - assets/lottie/not_found_page.json
    - assets/lottie/notification_empty.json
    - assets/lottie/pin.json
    - assets/lottie/processing.json
    - assets/svgs/adress.svg
    - assets/svgs/avatar.svg
    - assets/svgs/brand_logo_rounded.svg
    - assets/svgs/contact.svg
    - assets/svgs/delivery.svg
    - assets/svgs/delivery2.svg
    - assets/svgs/delivery_time.svg
    - assets/svgs/discount.svg
    - assets/svgs/empty.svg
    - assets/svgs/filter.svg
    - assets/svgs/menu.svg
    - assets/svgs/orderTime.svg
    - assets/svgs/pickUpFrom.svg
    - assets/svgs/star.svg
    - assets/svgs/ticket.svg
    # END sdk-app-assets
    - assets/svg/
    - assets/image/
    - assets/lottie/

flutter_icons:
  android: "launcher_icon"
  ios: true
  min_sdk_android: 23
  remove_alpha_ios: true
  image_path: 'assets/image/manager.png'

# Version arbitration across the composed SDK set (kernel pins an older
# ecosystem than the newest SDKs; root overrides win globally). Mirrors
# paas_driver's converted pubspec.
dependency_overrides:
  get_it: ^8.0.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  google_fonts: ^6.3.0
  http: ^1.2.0
  # auto_route_generator 10.3.x (required by the freezed 3.x / source_gen 3
  # toolchain) needs auto_route 10.x, while the composed SDKs still pin
  # ^9.2.0. 10.1+ keeps the renamed 9.x APIs (e.g. replaceNamed) as deprecated
  # aliases, so composed source compiles unchanged. Follow-up: bump the SDK
  # auto_route pins, then this override can go.
  auto_route: ^10.3.0
  # drift must stay on a release whose sqlite3 constraint admits the pinned
  # sqlite3 2.9.4 below (2.34.x moved to sqlite3 ^3.x and fails to compile
  # against it). Mirrors supacharge's arbitration of the same conflict.
  drift: 2.31.0
  sqlite3: 2.9.4
  # auth_sdk still pins ^11.3.1 while hardware_sdk needs ^12.0.1; the two
  # ranges don't overlap, so arbitrate at the root. v11->v12 is API-compatible
  # for the composed usage (plain Permission.x.request() calls). Follow-up:
  # bump auth_sdk's constraint in RokctAI/Users, then this override can go.
  permission_handler: ^12.0.1
  # html 0.15.7 (published 2026-08-28) removed the private query_selector matches()
  # that flutter_html 3.0.0 imports; pin until flutter_html ships a compatible release.
  html: 0.15.6
