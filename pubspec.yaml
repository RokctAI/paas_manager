  flutter_test:
    sdk: flutter
  freezed: ^2.5.2
  build_runner: ^2.4.8
  flutter_lints: ^5.0.0
  auto_route_generator: ^9.0.0
  flutter_launcher_icons: ^0.14.1

flutter_native_splash:
