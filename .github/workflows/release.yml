name: Auto Release (Weekly)

permissions: write-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-release
  # Never auto-cancel a release run: cancelling mid-publish can leave partial
  # releases (half-uploaded assets, dangling tags).
  cancel-in-progress: false

on:
  push:
    # main/develop are handled by Build (Smart) (build.yml), which carries the
    # same weekly release configuration — this workflow is the sole pipeline
    # for client build_* branches (and manual dispatch).
    branches: ["build_*"]
  workflow_dispatch:
    inputs:
      node-version:
        type: string
        default: '24'
      python-version:
        type: string
        default: '3.14'
      mariadb-version:
        type: string
        default: '10.6'
      postgres-version:
        type: string
        default: '15'
      db-type:
        type: string
        default: 'mariadb'
      flutter-channel:
        type: string
        default: 'stable'
      java-version:
        type: string
        default: '17'
      version_format:
        type: string
        default: '##.##.##'
        description: "Format for version bumping (e.g. ##.##.## or ##.##.#)"

jobs:
  release:
    uses: RokctAI/shared-workflows/.github/workflows/universal-pipeline.yml@b9c47be3df4a94d94862827ca149a345ce1572c5 # shared-workflows main (gateway envelope + release windows CXXFLAGS fix)
    with:
      project_type: 'flutter'
      app-type: 'manager'
      # Dogfooding: Use the new Weekly Strategy
      release_strategy: 'weekly'

      # This workflow only fires on build_* pushes and manual dispatch, where it
      # is the sole pipeline — so it always lints (main is linted by Code
      # Quality, develop by Build (Smart)).
      run_lint: true

      # RC Cleanup: Delete RC releases/tags after promotion to stable
      cleanup_rc_releases: true
      
      # One-time cleanup: Set a cutoff date (YYYY-MM-DD) to run cleanup once if past this date
      # After cleanup runs once, a marker file is created and cleanup won't run again
      # Example: one_time_cleanup_cutoff_date: '2026-02-01'
      one_time_cleanup_cutoff_date: '2026-01-30'
      
      # Brain Endpoint 
      brain_endpoint: https://platform.rokct.ai/api/v1/method/rokct.platform.api

      # Build APK
      build_android: true
      # Build Windows desktop app and attach it to releases (windows/ scaffolding is
      # installed by desktop_sdk at compose time and committed back like android/ etc.)
      build_windows: true
      # Environment configuration
      node-version: ${{ inputs.node-version || '24' }}
      python-version: ${{ inputs.python-version || '3.14' }}
      mariadb-version: ${{ inputs.mariadb-version || '10.6' }}
      postgres-version: ${{ inputs.postgres-version || '15' }}
      db-type: ${{ inputs.db-type || 'mariadb' }}
      flutter-channel: ${{ inputs.flutter-channel || 'stable' }}
      flutter-version: '3.38.5'
      java-version: ${{ inputs.java-version || '17' }}
      version_format: ${{ inputs.version_format || '##.##.##' }}
    secrets: inherit
